services:
  - type: web
    name: exercise-tracker
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: exercise-tracker-db
          property: connectionString

databases:
  - name: exercise-tracker-db
    plan: free
